<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Sojourner Labs</title><link rel="stylesheet" href="assets/styles.css"></head>
<body><nav class="noprint"><div class="wrap">
  <a class="logo" href="index.html"><svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c9cff"/><stop offset="1" stop-color="#38e1c6"/></linearGradient></defs><circle cx="16" cy="16" r="14" fill="none" stroke="url(#g)" stroke-width="2.5"/><path d="M8 20 Q16 6 24 20" fill="none" stroke="url(#g)" stroke-width="2.5"/><circle cx="16" cy="12" r="2.5" fill="#38e1c6"/></svg>SOJOURNER LABS</a>
  <ul><li><a href="missions.html">Missions</a></li><li><a href="pricing.html">Pricing</a></li><li><a href="onboarding.html">How It Works</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li></ul>
  <a class="btn" href="missions/brightline-breach.html">Try the demo</a>
</div></nav>
<main class="wrap page"><h1>Talk with us</h1><p class="sub">Ask about a license, a live workshop, or a custom mission built around your business.</p>
<form id="f" class="card" style="max-width:620px">
<p><input class="field" name="name" placeholder="Your name" required></p>
<p><input class="field" name="email" type="email" placeholder="Work email" required></p>
<p><input class="field" name="company" placeholder="Company"></p>
<p><select class="field" name="size"><option>1 to 15 employees</option><option>16 to 50 employees</option><option>51 to 250 employees</option><option>More than 250</option></select></p>
<p><textarea class="field" name="message" placeholder="What would you like to know?"></textarea></p>
<button class="btn">Send</button><div class="msg" id="m"></div></form></main>
<footer><div class="wrap">© 2026 Sojourner Labs. All rights reserved. · <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a> · <a href="verify.html">Verify a certificate</a> · <a href="contact.html">Contact</a></div></footer>
<script src="assets/config.js"></script><script>
document.getElementById('f').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),m=document.getElementById('m');
if(SJL.formEndpoint){fetch(SJL.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({type:'contact',...d})}).then(r=>{m.className='msg '+(r.ok?'ok':'no');m.textContent=r.ok?'Thanks. We will reply within one business day.':'Something went wrong. Please email '+SJL.email+'.'})}
else location.href='mailto:'+SJL.email+'?subject='+encodeURIComponent('Sojourner Labs inquiry from '+d.company)+'&body='+encodeURIComponent(Object.entries(d).map(([k,v])=>k+': '+v).join('\n'))};
</script>
</body></html>
