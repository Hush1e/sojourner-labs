<script>window.MISSION = {"title": "Locked Out", "topic": "Account Security", "minutes": 12, "code": "PW", "story": ["You are the go to tech person at Riverbend Insurance Agency, mostly because you know how to fix the printer.", "This morning brings a string of account problems. Solve each one before the attacker gets in."], "rooms": [{"title": "Pick a Password", "type": "choice", "prompt": "Which password is the strongest choice for a new email account?", "options": [{"v": "a-1", "label": "A-1", "body": "Riverbend2026!"}, {"v": "a-2", "label": "A-2", "body": "P@ssw0rd#1"}, {"v": "a-3", "label": "A-3", "body": "copper lantern orbit maple fifteen"}], "hints": ["Attackers try company names, years, and common swaps first.", "Length beats complexity."], "lesson": "A long passphrase of random words is stronger and easier to remember than a short complex password. A password manager makes it even easier.", "hash": "2cb72cc6837572f49baf91e463c75685f5befc1a4fc1bc8533a7f5619ef2c34f"}, {"title": "The Midnight Prompt", "type": "hotspot", "prompt": "At 2:13 a.m. your phone shows this. You are not logging in. Click the right response.", "scene": "<div class=\"dark\" style=\"max-width:360px;margin:auto;text-align:center;padding:24px;border-radius:24px\"><p><b>Sign in request<\/b><\/p><p>Riverbend Mail<br>Location: Unknown<br>2:13 AM<\/p><p><span class=\"hot\" data-v=\"approve\" style=\"display:inline-block;padding:10px 20px;background:#2a8f5e;border-radius:10px\">Approve<\/span> <span class=\"hot\" data-v=\"deny\" style=\"display:inline-block;padding:10px 20px;background:#b33a52;border-radius:10px\">Deny, this was not me<\/span><\/p><\/div>", "hints": ["You were asleep.", "Approving lets the person with your password in."], "lesson": "An unexpected MFA prompt means someone already has your password. Deny it, then change your password and tell IT.", "hash": "3026a0ca485e5831657ba0120fa8dd66b3425427bfb0a2be0db743e2305cc7c5"}, {"title": "Prompt Bombing", "type": "choice", "context": "The prompts keep coming, twenty in a row. Then a text arrives from someone claiming to be IT, asking you to approve the next one to make it stop.", "prompt": "What do you do?", "options": [{"v": "b-1", "label": "B-1", "body": "Approve one so the notifications stop."}, {"v": "b-2", "label": "B-2", "body": "Keep denying, change your password from a trusted device, and report it to IT through a known contact."}, {"v": "b-3", "label": "B-3", "body": "Turn off MFA until it calms down."}], "hints": ["Real IT will never ask you to approve a prompt.", "Fatigue is the attacker's weapon."], "lesson": "MFA fatigue attacks try to wear you down. Report it, and ask IT about number matching prompts, which stop this trick.", "hash": "77c1005401bd4fd1dd7abead933235efcdb445de720551146bc8f8bd13abf74c"}, {"title": "Sharing Is Not Caring", "type": "choice", "prompt": "A coworker on vacation asks you to log in as them to send a client file. What is the best answer?", "options": [{"v": "e-1", "label": "E-1", "body": "Ask them to text you their password."}, {"v": "e-2", "label": "E-2", "body": "Use the password they wrote on a sticky note at their desk."}, {"v": "e-3", "label": "E-3", "body": "Ask the manager to grant you access to that file, or send it from a shared team folder."}], "hints": ["Shared passwords break accountability.", "There is almost always an approved way to share access."], "lesson": "Never share passwords. Delegated access and shared folders get the work done and keep a clear record of who did what.", "hash": "f52a315c8841749fb4904048364775f3b6b420d5278ce9b828eb464164271f36"}]};</script>
