<script>window.MISSION = {"title": "Voice of the CEO", "topic": "AI Threats", "minutes": 15, "code": "DV", "story": ["It is 4:45 on a Friday at Harlow Logistics. You handle accounts payable.", "Your phone rings, and the voice on the other end sounds exactly like the CEO, Marcus. AI can now clone a voice from a few seconds of audio. Can you tell what is real?"], "rooms": [{"title": "The Call", "type": "hotspot", "prompt": "Read the call transcript. Click the request that is the biggest red flag.", "scene": "<div class=\"dark\"><p><b>Caller (sounds like Marcus):<\/b> Hey, it is Marcus. I am stuck in airport security so I cannot talk long.<\/p><p>We are closing a deal today and I need you to <span class=\"hot\" data-v=\"wire\">send a $48,000 wire to a new vendor<\/span>.<\/p><p>The <span class=\"hot\" data-v=\"details\">account details are in a text I am sending you<\/span>.<\/p><p>And <span class=\"hot\" data-v=\"secret\">keep this between us until the deal is announced<\/span>. Thanks, you are a lifesaver.<\/p><\/div>", "hints": ["Urgent payments happen in real life. Which request is designed to stop you from checking?", "Who benefits if you tell no one?"], "lesson": "Secrecy is the signature of fraud. A real executive will never punish you for confirming a payment through normal channels.", "hash": "2bb80d537b1da3e38bd30361aa855686bde0eacd7162fef6a25fe97bf527a25b"}, {"title": "Verify", "type": "choice", "prompt": "How do you confirm the call is really Marcus?", "options": [{"v": "v-1", "label": "V-1", "body": "Call back the number that just called you."}, {"v": "v-2", "label": "V-2", "body": "Hang up and call Marcus at the number in the company directory, or reach his assistant."}, {"v": "v-3", "label": "V-3", "body": "Ask him a question only he would know."}], "hints": ["Caller ID can be spoofed.", "Use a channel the caller does not control."], "lesson": "Call back on a known number you already have. Personal questions fail because attackers research social media.", "hash": "3d6a1c50814d219cc0ce9e8d9964d44ba691995c06b1fc7040e8ad74ca0b3851"}, {"title": "The Video Meeting", "type": "choice", "context": "Ten minutes later, a video invite arrives. Marcus and the CFO appear on camera, both urging you to send the wire.", "prompt": "What is the right move?", "options": [{"v": "c-1", "label": "C-1", "body": "Send it. You can see both of them on video."}, {"v": "c-2", "label": "C-2", "body": "Send half now and half after the weekend."}, {"v": "c-3", "label": "C-3", "body": "Follow the written payment approval process, no matter who is asking."}], "hints": ["Deepfake video exists and has stolen millions.", "Process protects you even when your eyes are fooled."], "lesson": "In a widely reported 2024 case, an employee wired about $25 million after a video call in which every other participant was a deepfake. Process beats appearances.", "hash": "6bd5c4b852102b82f53a89e166343494844dc9f4cfd09e204331a5a52da1b02f"}, {"title": "Lock It Down", "type": "choice", "prompt": "Which company policy would stop this scam for good?", "options": [{"v": "k-1", "label": "K-1", "body": "Every new vendor or bank change needs a callback on a known number and a second approver."}, {"v": "k-2", "label": "K-2", "body": "Only accept payment requests by email."}, {"v": "k-3", "label": "K-3", "body": "Ban executives from making phone calls."}], "hints": ["Email can be faked too.", "Look for a control that needs two people."], "lesson": "Callback verification plus dual approval is the most effective defense against payment fraud, whether the request comes by voice, video, or email.", "hash": "7c35c5a1785d20704e44d5de4beb81c1fce91b6fe48ed7c3159af6f7f832078b"}]};</script>
