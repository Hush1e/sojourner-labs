<script>window.MISSION = {"title": "The AI Policy", "topic": "AI Awareness", "minutes": 15, "code": "AI", "story": ["Northgate Dental has eight employees, and everyone has started using AI chatbots to save time.", "The office manager has asked you to help set ground rules before something goes wrong. Work through four real situations from this week."], "rooms": [{"title": "Safe to Share?", "type": "choice", "prompt": "Which of these is safe to paste into a free public AI tool?", "options": [{"v": "s-1", "label": "S-1", "body": "A patient's X-ray notes so the AI can draft a referral letter."}, {"v": "s-2", "label": "S-2", "body": "Our public office hours so the AI can write a holiday closing notice."}, {"v": "s-3", "label": "S-3", "body": "The staff schedule with everyone's home phone numbers."}], "hints": ["Patient information is protected by law.", "Pick the one that is already public."], "lesson": "If information is already public, it is generally safe. Patient, customer, and employee details stay out of public AI tools.", "hash": "450222bcc3475b01aa69d5b0150a75a08a3bc3a87bb87ce4290ea7e0d4e51877"}, {"title": "The Confident Answer", "type": "hotspot", "prompt": "The AI wrote this answer. Click the part you must verify before using it.", "scene": "<div class=\"dark\"><p><span class=\"hot\" data-v=\"tone\">Great question!<\/span> Dental offices must keep patient records for a set period of time.<\/p><p>According to <span class=\"hot\" data-v=\"statute\">Ohio Revised Code 4715.99(B)(7)<\/span>, records must be kept for exactly 11 years.<\/p><p><span class=\"hot\" data-v=\"advice\">Always check with your compliance officer<\/span> for your specific situation.<\/p><\/div>", "hints": ["AI often invents details that sound official.", "Which part looks the most precise?"], "lesson": "AI tools can invent laws, citations, and numbers that look real. Check any legal or factual claim against an official source before you rely on it.", "hash": "503acf004b50b4f97beae09309f837a2ba47afacc83800fce9a1066813c7a97d"}, {"title": "Shadow AI", "type": "choice", "context": "A coworker found a free AI app that records meetings and writes notes automatically.", "prompt": "What should happen before the office starts using it?", "options": [{"v": "t-1", "label": "T-1", "body": "Nothing. It is free and saves time."}, {"v": "t-2", "label": "T-2", "body": "Use it only for patient appointments."}, {"v": "t-3", "label": "T-3", "body": "Have the owner review where recordings are stored and who can access them, then approve it or not."}], "hints": ["Free tools often pay for themselves with your data.", "Someone needs to approve tools that handle sensitive information."], "lesson": "Unapproved AI tools, often called shadow AI, are a top source of data leaks. A simple approval step keeps the business in control.", "hash": "b6b5bcaab8dc5b28e9280befc2258e3f34d198d4b5755005cd6badebeb6fb6cd"}, {"title": "Write the Rule", "type": "choice", "prompt": "Which rule belongs at the top of Northgate's AI policy?", "options": [{"v": "w-1", "label": "W-1", "body": "Never enter patient, customer, or employee personal information into an AI tool that the office has not approved."}, {"v": "w-2", "label": "W-2", "body": "AI may never be used for anything."}, {"v": "w-3", "label": "W-3", "body": "Use AI however you want as long as you are careful."}], "hints": ["A good rule is specific and realistic.", "Bans get ignored. Vague rules get misread."], "lesson": "Strong AI policies are short, specific, and focused on data. People follow rules they can understand.", "hash": "0065abd009780926778f5e00851728b300ca6605dd4c2603cc798ea0fd10388c"}]};</script>
