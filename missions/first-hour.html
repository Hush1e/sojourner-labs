<script>window.MISSION = {"title": "The First Hour", "topic": "Compliance and Incident Response", "minutes": 15, "code": "IR", "story": ["You manage the office at Kessler and Wade, a twelve person accounting firm.", "It is tax season. At 9:05 a.m. a bookkeeper calls you over because every file on her screen has a strange new extension, and a note demands payment."], "rooms": [{"title": "First Move", "type": "choice", "prompt": "What is the very first thing to do with the affected computer?", "options": [{"v": "f-1", "label": "F-1", "body": "Turn it off and back on to see if that fixes it."}, {"v": "f-2", "label": "F-2", "body": "Disconnect it from the network and Wi Fi, but leave it powered on."}, {"v": "f-3", "label": "F-3", "body": "Open the ransom note to read the instructions."}], "hints": ["Ransomware spreads across the network.", "Powering off can destroy evidence investigators need."], "lesson": "Isolate first. Unplugging the network stops the spread, and leaving the machine on preserves evidence in memory.", "hash": "b0356098ece57c97096b9b30224823c6e0769d54f055abcdbc3f3171ecb239c7"}, {"title": "The Ransom Note", "type": "hotspot", "prompt": "Click the instruction in the note you should not follow on your own.", "scene": "<div class=\"dark\" style=\"font-family:ui-monospace,monospace\"><p>YOUR FILES ARE ENCRYPTED.<\/p><p><span class=\"hot\" data-v=\"pay\">Pay 2.5 BTC within 48 hours to receive your key.<\/span><\/p><p><span class=\"hot\" data-v=\"police\">Do not contact police.<\/span><\/p><p><span class=\"hot\" data-v=\"id\">Your ID: KW-55821-X<\/span><\/p><\/div>", "hints": ["One of these is a decision only leadership, counsel, and your insurer should make.", "Think about money."], "lesson": "Never pay on your own. Payment does not guarantee recovery and may have legal implications. Leadership, legal counsel, your insurer, and law enforcement decide together.", "hash": "9350872d712a127c494d7dc35e46b0bc9e62e288239708e581dfc3a1400154a4"}, {"title": "Who to Call", "type": "choice", "prompt": "Which call list is right for the first hour?", "options": [{"v": "g-1", "label": "G-1", "body": "Your IT provider, the firm's partners, and your cyber insurance carrier's claim line."}, {"v": "g-2", "label": "G-2", "body": "Every client, so they hear it from you first."}, {"v": "g-3", "label": "G-3", "body": "Nobody until you know more."}], "hints": ["Insurance policies often require prompt notice.", "Client notice comes later, with legal guidance."], "lesson": "Many cyber policies require quick notice and offer a response team. Client and regulator notifications follow legal advice and the facts.", "hash": "b9817549cc546b0ee549a42a97b94811ed862005f8c17409217cc58128d8f630"}, {"title": "Prove You Were Ready", "type": "choice", "context": "Ohio's Data Protection Act (ORC 1354) can give businesses a legal defense in some breach lawsuits if they maintained a reasonable written cybersecurity program.", "prompt": "Which record helps show the firm had a cybersecurity program in place?", "options": [{"v": "h-1", "label": "H-1", "body": "A verbal promise that everyone knows the rules."}, {"v": "h-2", "label": "H-2", "body": "The ransom note."}, {"v": "h-3", "label": "H-3", "body": "A written security program, plus dated training records for every employee."}], "hints": ["Documentation is what counts.", "What can you hand to an attorney or insurer?"], "lesson": "Written policies and dated training certificates show the firm took security seriously. This is general information, not legal advice. Talk with an attorney about your situation.", "hash": "2edce89ef182f499eda3ac109f51d7c01954b4e5f07b78a6b3569b5ea047ce0c"}]};</script>
