<script>window.MISSION = {"title": "The Brightline Breach", "topic": "Security Essentials", "minutes": 20, "code": "BB", "story": ["Welcome to Brightline Supply Co. You started this morning, and your manager is out until noon.", "Within an hour, strange things begin to happen. An urgent email, a coworker asking for AI help, a vendor in a rush, and a stranger at the door. Each room locks until you make the right call."], "rooms": [{"title": "The Inbox", "type": "hotspot", "prompt": "Click the one detail that proves this email is a phish.", "scene": "<div class=\"hdr\"><b>From:<\/b> IT Helpdesk &lt;<span class=\"hot\" data-v=\"helpdesk@brightline-supply-support.com\">helpdesk@brightline-supply-support.com<\/span>&gt;<br><b>To:<\/b> you@brightlinesupply.com<br><b>Subject:<\/b> <span class=\"hot\" data-v=\"subject\">Password expires today<\/span><\/div><p>Hi <span class=\"hot\" data-v=\"greeting\">team member<\/span>,<\/p><p>Your Brightline password expires in 2 hours. To keep access to email and payroll, verify your account now.<\/p><p><span class=\"hot\" data-v=\"button\" style=\"background:#2b59ff;color:#fff;padding:8px 14px;border-radius:6px\">Verify account<\/span><\/p><p>Thank you,<br><span class=\"hot\" data-v=\"signature\">Brightline IT Support<\/span><\/p>", "hints": ["Urgency is a warning sign, but it is not proof. Look for something that cannot be faked.", "Compare the sender to your own address, you@brightlinesupply.com."], "lesson": "The real company domain is brightlinesupply.com. Attackers register look alike domains that add words such as support or secure. Always check the sender's domain before you click.", "hash": "5c1c0b22dee49db2aaec2c62f7357a0e5d1d1570660433308a9e31cdc0f23816"}, {"title": "The AI Assistant", "type": "choice", "context": "Three coworkers want to paste these prompts into a free public AI chatbot.", "prompt": "Which prompt should never be sent?", "options": [{"v": "p-4402", "label": "P-4402", "body": "Write a friendly reminder asking staff to submit timesheets by Friday."}, {"v": "p-7319", "label": "P-7319", "body": "Summarize this complaint: Dana Ruiz, 41 Elm St, card ending 8812, says her order was double charged."}, {"v": "p-1185", "label": "P-1185", "body": "Give me five ideas for a spring promotion for a small supply company."}], "hints": ["Two of these contain nothing private. Look for a real person.", "Names, home addresses, and card details are customer data."], "lesson": "Public AI tools may store what you type. Remove names, addresses, and account details first, or use a company approved AI tool.", "hash": "005d28bf3aa07a0f72e91d6d967914d92a79dc99cf8a81646d0082883a22027f"}, {"title": "The Vendor Rush", "type": "choice", "prompt": "A vendor needs this week's customer order file today. How do you send it?", "options": [{"v": "m-1", "label": "M-1", "body": "Email the spreadsheet as an attachment so they get it fast."}, {"v": "m-2", "label": "M-2", "body": "Share it through the company's approved secure portal with access limited to that vendor."}, {"v": "m-3", "label": "M-3", "body": "Put it on a USB drive and mail it."}], "hints": ["Think about who else could see or lose that file.", "Which option controls exactly who can open it?"], "lesson": "Approved, access limited sharing protects customer data and leaves a record. Email attachments get forwarded and USB drives get lost.", "hash": "8ae2a41095969ce3ebefc08446532811f94c840741cdcb845bc041936ef60523"}, {"title": "The Front Door", "type": "choice", "context": "A person in a delivery vest is holding a large box at the badge door. They smile and say their hands are full.", "prompt": "What do you do?", "options": [{"v": "d-1", "label": "D-1", "body": "Hold the door. They are clearly a delivery driver."}, {"v": "d-2", "label": "D-2", "body": "Let them in but watch where they go."}, {"v": "d-3", "label": "D-3", "body": "Politely say you will have reception sign them in, and point them to the front desk."}], "hints": ["A vest and a box are easy to fake.", "Who is responsible for letting visitors in?"], "lesson": "Tailgating is one of the easiest ways into a building. A polite redirect to reception is never rude, and real drivers expect it.", "hash": "da4da5e81359a1c9212c3cbce5a4b5c0805519fa583e24e4605528d764a6653e"}, {"title": "The Report", "type": "choice", "prompt": "Your manager is back. You realize you clicked a link in a similar email last week. What now?", "options": [{"v": "r-1", "label": "R-1", "body": "Tell IT or your manager right away, including when you clicked."}, {"v": "r-2", "label": "R-2", "body": "Change your password quietly and say nothing."}, {"v": "r-3", "label": "R-3", "body": "Wait and see if anything bad happens."}], "hints": ["Silence helps the attacker.", "The sooner IT knows, the smaller the damage."], "lesson": "Fast reporting turns a breach into a near miss. Good companies thank people who report mistakes.", "hash": "a5fa777a3dc67268caea6eea038ba14177e360dba84e1db44e738dbae137e7ef"}]};</script>
